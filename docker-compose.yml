version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: quantum_mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: po_b2b_dev
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantum_backend
    restart: always
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: po_b2b_dev
      JWT_SECRET: ${JWT_SECRET:-production-secret-change-this-random-string-987654321}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@quantumeme.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ""
    container_name: quantum_frontend
    restart: always

  proxy:
    image: nginx:alpine
    container_name: quantum_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
    depends_on:
      - frontend
      - backend

volumes:
  mongo_data:
  certbot_etc:
  certbot_var:
